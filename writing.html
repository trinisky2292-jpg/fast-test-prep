<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST Test Prep — Writing</title>
    <style>
        :root { --primary:#4CAF50; --secondary:#2196F3; --accent:#FFC107; --write:#FF7043; --background:#F5F5F5; --text:#212121; --light:#757575; --white:#fff; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--background); color:var(--text); line-height:1.6; padding:1rem; }
        .container { max-width:900px; margin:0 auto; }
        header { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; padding:1rem; background:var(--white); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
        header h1 { font-size:1.4rem; color:var(--write); }
        header a.home { color:var(--secondary); text-decoration:none; font-weight:500; }
        .card { background:var(--white); border-radius:14px; padding:1.1rem 1.25rem; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:1.1rem; }
        .card h2 { font-size:1.15rem; margin-bottom:.6rem; color:var(--text); }
        .facts { list-style:none; display:flex; flex-wrap:wrap; gap:.5rem; }
        .facts li { background:#FFF3E0; color:#E65100; font-weight:600; font-size:.85rem; padding:.3rem .7rem; border-radius:50px; }
        .rubric { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:.8rem; }
        .rub { border:1px solid #eee; border-left:6px solid var(--write); border-radius:10px; padding:.8rem; }
        .rub h3 { font-size:1rem; } .rub .pts { font-size:.78rem; font-weight:700; color:#fff; background:var(--write); padding:.1rem .5rem; border-radius:50px; }
        .rub .kid { font-size:.9rem; color:var(--light); margin:.35rem 0; }
        .rub ul { margin-left:1.1rem; font-size:.85rem; }
        .steps { counter-reset:s; list-style:none; }
        .steps li { position:relative; padding:.5rem 0 .5rem 2.4rem; border-bottom:1px dashed #eee; }
        .steps li:before { counter-increment:s; content:counter(s); position:absolute; left:0; top:.5rem; width:1.7rem; height:1.7rem; background:var(--write); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; }
        .steps li b { display:block; }
        .steps li span { font-size:.9rem; color:var(--light); }
        .tbank { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.7rem; }
        .tbank .tb { background:#F1F8E9; border-radius:8px; padding:.6rem .7rem; }
        .tbank .tb h4 { font-size:.85rem; margin-bottom:.3rem; color:#33691E; }
        .tbank .tb span { display:block; font-size:.85rem; color:#555; }
        .prompt-card { border-left:6px solid var(--secondary); }
        .prompt-card h2 { color:var(--secondary); }
        .pbtn { background:var(--write); color:#fff; border:none; padding:.6rem 1.1rem; border-radius:50px; font-weight:700; cursor:pointer; font-size:.95rem; }
        .src { background:#FAFAFA; border:1px solid #eee; border-radius:8px; padding:.8rem; margin:.6rem 0; }
        .src h4 { font-size:.95rem; margin-bottom:.3rem; }
        .src p { font-size:.92rem; white-space:pre-wrap; }
        .promptbox { background:#E3F2FD; border-radius:8px; padding:.8rem; font-weight:600; margin:.7rem 0; }
        .planner { background:#FFF8E1; border-radius:8px; padding:.7rem; font-size:.9rem; margin:.5rem 0; }
        textarea { width:100%; min-height:220px; border:2px solid #ddd; border-radius:8px; padding:.7rem; font-size:1rem; font-family:inherit; line-height:1.5; resize:vertical; }
        .wc { font-size:.82rem; color:var(--light); margin:.3rem 0 .7rem; }
        .model { background:#E8F5E9; border-radius:8px; padding:.8rem; margin:.6rem 0; white-space:pre-wrap; font-size:.92rem; }
        .checklist { list-style:none; } .checklist li { margin:.25rem 0; font-size:.92rem; } .checklist input { margin-right:.5rem; transform:scale(1.2); }
        .toggle { background:none; border:1px solid var(--write); color:var(--write); padding:.45rem .9rem; border-radius:50px; font-weight:600; cursor:pointer; margin:.4rem .4rem .4rem 0; font-size:.88rem; }
        .hidden { display:none; }
        .coach { margin-top:.6rem; background:#FFFDE7; border:1px solid #FFE082; border-radius:10px; padding:.9rem; }
        .coach .total { font-size:1.3rem; font-weight:800; }
        .coach .dom { margin:.6rem 0; }
        .coach .dom .bar { background:#eee; border-radius:50px; height:12px; overflow:hidden; margin:.2rem 0; }
        .coach .dom .fill { height:100%; background:var(--write); border-radius:50px; }
        .coach .dom h4 { font-size:.92rem; }
        .coach .tips { margin:.3rem 0 .2rem 1.1rem; font-size:.88rem; color:#5D4037; }
        .coach .good { color:#2E7D32; font-weight:700; }
        .empty { background:var(--white); border-radius:12px; padding:2rem; text-align:center; color:var(--light); }
        @media (max-width:480px){ header{flex-direction:column;align-items:stretch;} }
    </style>
    <script src="js/grade.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Writing Builder</h1>
            <a class="home" href="index.html">&larr; Home</a>
        </header>
        <div id="content"><div class="empty">Loading…</div></div>
    </div>

    <script>
    (function () {
        if (window.FastGrade && FastGrade.get() !== '6') FastGrade.set('6');
        function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        fetch('data/books/writing.json').then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
        .then(function(d){
            if (!d) { document.getElementById('content').innerHTML = '<div class="empty">📝 The writing lessons are being prepared — check back in a minute!</div>'; return; }
            var html = '';
            // Overview
            if (d.overview) {
                html += '<div class="card"><h2>What is the 6th-grade writing test?</h2><p>' + esc(d.overview.what) + '</p>' +
                    '<ul class="facts" style="margin-top:.7rem;">' + (d.overview.facts||[]).map(function(f){ return '<li>'+esc(f)+'</li>'; }).join('') + '</ul></div>';
            }
            // Rubric
            if (d.rubric) {
                html += '<div class="card"><h2>How it\'s scored (0–12)</h2><div class="rubric">' + d.rubric.map(function(r){
                    return '<div class="rub"><h3>'+esc(r.domain)+' <span class="pts">'+esc(r.points)+'</span></h3>' +
                        '<div class="kid">'+esc(r.kid)+'</div><ul>'+(r.lookFors||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
                }).join('') + '</div></div>';
            }
            // Method
            if (d.method) {
                html += '<div class="card"><h2>How to write the essay — step by step</h2><ul class="steps">' + d.method.map(function(m){
                    return '<li><b>'+esc(m.title)+'</b><span>'+esc(m.do)+'</span></li>';
                }).join('') + '</ul></div>';
            }
            // Transitions
            if (d.transitions) {
                var labels = {claim:'Stating your claim', addingEvidence:'Adding evidence', counter:'The other side', conclusion:'Concluding'};
                html += '<div class="card"><h2>Sentence starters &amp; transitions</h2><div class="tbank">' +
                    Object.keys(d.transitions).map(function(k){
                        return '<div class="tb"><h4>'+esc(labels[k]||k)+'</h4>'+(d.transitions[k]||[]).map(function(s){return '<span>"'+esc(s)+'"</span>';}).join('')+'</div>';
                    }).join('') + '</div></div>';
            }
            // Writing Lessons
            if (d.lessons && d.lessons.length) {
                html += '<div class="card"><h2>✍️ Writing Lessons — learn how to write the essay</h2>' +
                    d.lessons.map(function(L){
                        return '<button class="toggle" data-lesson="'+L.n+'" style="display:block;width:100%;text-align:left;margin:.3rem 0;">📖 Lesson '+L.n+': '+esc(L.title)+'</button>' +
                            '<div class="model hidden" id="lesson-'+L.n+'" style="background:#FFF3E0;">'+esc(L.teach)+'</div>';
                    }).join('') + '</div>';
            }
            // Worked Example (walkthrough)
            if (d.walkthrough) {
                var w = d.walkthrough;
                var wh = '<div class="card"><h2>📘 Worked Example — a prompt from blank page to finished essay</h2>' +
                    '<div class="promptbox">'+esc(w.prompt||w.promptTitle||'')+'</div>';
                (w.sources||[]).forEach(function(s){ wh += '<div class="src"><h4>📄 '+esc(s.title)+'</h4><p>'+esc(s.text)+'</p></div>'; });
                wh += '<ul class="steps">' + (w.steps||[]).map(function(st){
                    return '<li><b>'+esc(st.title)+'</b><span>'+esc(st.think||'')+'</span>' + (st.example ? '<div class="model" style="margin-top:.4rem;background:#E8F5E9;">'+esc(st.example)+'</div>' : '') + '</li>';
                }).join('') + '</ul>';
                if (w.finalEssay) { wh += '<h4 style="margin:.6rem 0 .3rem;">✅ The finished essay all together:</h4><div class="model">'+esc(w.finalEssay)+'</div>'; }
                wh += '</div>';
                html += wh;
            }

            // Prompts
            (d.prompts||[]).forEach(function(p){
                var key = 'fast-writing-' + p.id;
                html += '<div class="card prompt-card"><h2>✍️ '+esc(p.title)+'</h2>' +
                    '<button class="pbtn" data-open="'+p.id+'">Open this writing prompt</button>' +
                    '<div class="hidden" id="body-'+p.id+'">' +
                        (p.sources||[]).map(function(s){ return '<div class="src"><h4>📄 '+esc(s.title)+'</h4><p>'+esc(s.text)+'</p></div>'; }).join('') +
                        '<div class="promptbox">'+esc(p.prompt)+'</div>' +
                        (p.planner ? '<div class="planner"><b>Plan it:</b> '+esc(p.planner.question||'')+'<br>One side: '+esc(p.planner.sideA||'')+' · Other side: '+esc(p.planner.sideB||'')+(p.planner.hint?'<br>'+esc(p.planner.hint):'')+'</div>' : '') +
                        '<h4 style="margin:.6rem 0 .3rem;">Write your essay here:</h4>' +
                        '<textarea id="ta-'+p.id+'" placeholder="Start with your hook and your claim..."></textarea>' +
                        '<div class="wc" id="wc-'+p.id+'">0 words · saved automatically</div>' +
                        '<button class="toggle" data-model="'+p.id+'">📗 Show / hide model essay</button>' +
                        '<button class="toggle" data-clear="'+p.id+'">🗑️ Clear my writing</button>' +
                        '<div class="model hidden" id="model-'+p.id+'">'+esc(p.model)+'</div>' +
                        '<h4 style="margin:.8rem 0 .3rem;">📊 Writing Coach — score my essay &amp; how to improve</h4>' +
                        '<button class="pbtn" data-coach="'+p.id+'">Check my essay</button>' +
                        '<div class="coach hidden" id="coach-'+p.id+'"></div>' +
                        '<h4 style="margin:.8rem 0 .3rem;">Check your own essay:</h4>' +
                        '<ul class="checklist">'+(p.checklist||[]).map(function(c,i){ return '<li><label><input type="checkbox" data-chk="'+p.id+'-'+i+'">'+esc(c)+'</label></li>'; }).join('')+'</ul>' +
                    '</div></div>';
            });
            document.getElementById('content').innerHTML = html;

            // Wire interactions
            document.querySelectorAll('[data-open]').forEach(function(b){
                b.addEventListener('click', function(){
                    var id=b.getAttribute('data-open'); var body=document.getElementById('body-'+id);
                    body.classList.toggle('hidden');
                    b.textContent = body.classList.contains('hidden') ? 'Open this writing prompt' : 'Close';
                });
            });
            document.querySelectorAll('[data-model]').forEach(function(b){
                b.addEventListener('click', function(){ document.getElementById('model-'+b.getAttribute('data-model')).classList.toggle('hidden'); });
            });
            document.querySelectorAll('[data-lesson]').forEach(function(b){
                b.addEventListener('click', function(){ document.getElementById('lesson-'+b.getAttribute('data-lesson')).classList.toggle('hidden'); });
            });

            // ---- Built-in Writing Coach (rule-based, instant, free) ----
            var RUBRIC = d.rubric || [];
            var TIPS = d.improveTips || {};
            function analyzeEssay(text){
                var t = (text||'').trim();
                var lower = t.toLowerCase();
                var words = t ? t.split(/\s+/).length : 0;
                var paras = t.split(/\n\s*\n/).map(function(s){return s.trim();}).filter(Boolean);
                var sentences = t.split(/[.!?]+/).map(function(s){return s.trim();}).filter(Boolean);
                var has = function(arr){ return arr.some(function(k){ return lower.indexOf(k)>=0; }); };
                var claim = has(['i believe','i think','should ','should not','must ','i argue','in my opinion','it is clear that','the best']);
                var evidenceCues = ['according to','the source','source 1','source 2','the author','the article','states that','for example','research shows','the passage','the text','studies show','"'];
                var evidenceCount = evidenceCues.reduce(function(n,k){ return n + (lower.split(k).length-1); }, 0);
                var counter = has(['some people','others argue','others may','however','on the other hand','while it is true','critics','opponents','some may say','even though','although some']);
                var conclusion = has(['in conclusion','for these reasons','to sum up','overall','in the end','that is why','this is why']) || paras.length>=4;
                var transitions = ['first','second','next','also','for example','in addition','furthermore','therefore','because','as a result','finally','moreover'].reduce(function(n,k){return n+(lower.indexOf(k)>=0?1:0);},0);
                var casual = ['gonna','wanna','kinda','lol','a lot of stuff','stuff','gotta','kids these days','u ','ur ',' cuz'];
                var casualHits = casual.filter(function(k){ return lower.indexOf(k)>=0; });
                // varied sentence starts
                var starts = {}; sentences.forEach(function(s){ var w=(s.split(/\s+/)[0]||'').toLowerCase(); starts[w]=(starts[w]||0)+1; });
                var maxStart = Math.max.apply(null, [1].concat(Object.keys(starts).map(function(k){return starts[k];})));

                // Domain 1: Purpose/Structure (0-4)
                var d1=0, d1n=[];
                if (paras.length>=4) d1++; else d1n.push('Organize into at least 4 paragraphs: intro, 2 body paragraphs, and a conclusion.');
                if (claim) d1++; else d1n.push('Add a clear THESIS in your intro that names the side you are arguing.');
                if (conclusion) d1++; else d1n.push('End with a conclusion that restates your claim and your reasons.');
                if (counter && transitions>=2) d1++; else d1n.push('Add a paragraph that answers the OTHER side, and use transition words (First, In addition, Therefore).');

                // Domain 2: Development/Evidence (0-4)
                var d2=0, d2n=[];
                if (evidenceCount>=1) d2++; else d2n.push('Use evidence FROM the sources — quote or paraphrase and write "According to Source 1...".');
                if (evidenceCount>=2) d2++; else d2n.push('Use evidence from BOTH sources (at least 2 pieces total).');
                if (words>=250) d2++; else d2n.push('Develop your ideas more — aim for at least 300–400 words.');
                if (evidenceCount>=2 && words>=320) d2++; else d2n.push('After each piece of evidence, EXPLAIN how it proves your claim (don’t just drop a quote).');

                // Domain 3: Language/Conventions (0-4)
                var d3=0, d3n=[];
                if (words>=120) d3++; else d3n.push('Write more so your sentences and word choice can be judged (too short right now).');
                if (casualHits.length===0) d3++; else d3n.push('Use FORMAL language — remove casual words like: '+casualHits.join(', ')+'.');
                if (maxStart<=Math.max(2, Math.ceil(sentences.length*0.4))) d3++; else d3n.push('Vary how your sentences begin — don’t start most of them the same way.');
                if (words>=300 && casualHits.length===0) d3++; else d3n.push('Reread for grammar, spelling, capital letters, and punctuation.');

                var domains = [
                    {name: RUBRIC[0] ? RUBRIC[0].domain : 'Purpose, Focus & Structure', score:d1, tips:d1n},
                    {name: RUBRIC[1] ? RUBRIC[1].domain : 'Development & Evidence', score:d2, tips:d2n},
                    {name: RUBRIC[2] ? RUBRIC[2].domain : 'Language & Conventions', score:d3, tips:d3n}
                ];
                return {words:words, total:d1+d2+d3, domains:domains};
            }
            function renderCoach(pid){
                var ta = document.getElementById('ta-'+pid);
                var box = document.getElementById('coach-'+pid);
                if (!ta || !box) return;
                var text = ta.value || '';
                if (text.trim().split(/\s+/).filter(Boolean).length < 25) {
                    box.classList.remove('hidden');
                    box.innerHTML = '<b>Write a bit more first</b> — type at least a few sentences in the box above, then press “Check my essay” and I’ll score it and show you how to improve.';
                    return;
                }
                var r = analyzeEssay(text);
                var msg = r.total>=10 ? '🌟 Great essay!' : r.total>=7 ? '👍 Good start — here’s how to score higher:' : '💪 Let’s make this stronger — here’s exactly how:';
                var hh = '<div class="total">Score: '+r.total+' / 12</div><div style="font-size:.85rem;color:#777;">'+r.words+' words · '+msg+'</div>';
                r.domains.forEach(function(dom){
                    var pct = (dom.score/4)*100;
                    hh += '<div class="dom"><h4>'+esc(dom.name)+': '+dom.score+'/4</h4><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>';
                    if (dom.score>=4) { hh += '<div class="good">✅ Strong here!</div>'; }
                    else {
                        var extra = (TIPS[dom.name]||[]);
                        var allTips = dom.tips.concat(extra).slice(0,4);
                        hh += '<ul class="tips">'+allTips.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
                    }
                    hh += '</div>';
                });
                hh += '<div style="font-size:.82rem;color:#777;margin-top:.4rem;">Fix the tips above, then press “Check my essay” again to watch your score go up. 📈</div>';
                box.classList.remove('hidden');
                box.innerHTML = hh;
            }
            document.querySelectorAll('[data-coach]').forEach(function(b){
                b.addEventListener('click', function(){ renderCoach(b.getAttribute('data-coach')); });
            });
            // textarea autosave + word count
            (d.prompts||[]).forEach(function(p){
                var ta=document.getElementById('ta-'+p.id); var wc=document.getElementById('wc-'+p.id);
                if (!ta) return;
                var saved = localStorage.getItem('fast-writing-'+p.id); if (saved) ta.value = saved;
                function upd(){ var w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; wc.textContent = w+' words · saved automatically'; }
                upd();
                ta.addEventListener('input', function(){ localStorage.setItem('fast-writing-'+p.id, ta.value); upd(); });
                // restore checklist
                (p.checklist||[]).forEach(function(c,i){
                    var cb=document.querySelector('[data-chk="'+p.id+'-'+i+'"]');
                    if (cb){ cb.checked = localStorage.getItem('fast-chk-'+p.id+'-'+i)==='1';
                        cb.addEventListener('change', function(){ localStorage.setItem('fast-chk-'+p.id+'-'+i, cb.checked?'1':'0'); }); }
                });
            });
            document.querySelectorAll('[data-clear]').forEach(function(b){
                b.addEventListener('click', function(){
                    var id=b.getAttribute('data-clear');
                    if (confirm('Clear your writing for this prompt?')) {
                        localStorage.removeItem('fast-writing-'+id);
                        var ta=document.getElementById('ta-'+id); if(ta){ ta.value=''; ta.dispatchEvent(new Event('input')); }
                    }
                });
            });
        });
    })();
    </script>
</body>
</html>
