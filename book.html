<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST Test Prep — Learn by the Book</title>
    <style>
        :root { --primary:#4CAF50; --secondary:#2196F3; --accent:#FFC107; --background:#F5F5F5; --text:#212121; --light-text:#757575; --white:#fff; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--background); color:var(--text); line-height:1.6; padding:1rem; }
        .container { max-width:900px; margin:0 auto; }
        header { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; padding:1rem; background:var(--white); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
        header h1 { font-size:1.4rem; color:var(--primary); }
        header a.home { color:var(--secondary); text-decoration:none; font-weight:500; }
        .intro { background:var(--white); border-radius:12px; padding:1rem 1.25rem; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:1.25rem; color:var(--light-text); }
        .topic { background:var(--white); border-radius:16px; margin-bottom:.9rem; box-shadow:0 4px 12px rgba(0,0,0,.07); overflow:hidden; border-left:6px solid var(--secondary); }
        .topic-head { display:flex; align-items:center; gap:.85rem; padding:1rem 1.15rem; cursor:pointer; }
        .topic-num { flex:none; width:40px; height:40px; border-radius:50%; background:var(--secondary); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; }
        .topic-head h2 { font-size:1.08rem; flex:1; }
        .topic-head .chev { color:var(--light-text); transition:transform .2s; }
        .topic.open .chev { transform:rotate(90deg); }
        .topic-body { display:none; padding:0 1.15rem 1.15rem; }
        .topic.open .topic-body { display:block; }
        .topic-practice { display:inline-block; margin:.2rem 0 .9rem; background:var(--secondary); color:#fff; padding:.5rem 1.1rem; border-radius:50px; text-decoration:none; font-weight:700; font-size:.9rem; }
        .lesson { border:1px solid #eee; border-radius:12px; padding:.85rem 1rem; margin-bottom:.7rem; background:#fafafa; }
        .lesson .lh { display:flex; gap:.55rem; align-items:baseline; }
        .lesson .code { font-weight:800; color:var(--secondary); flex:none; }
        .lesson .lt { font-weight:700; }
        .lesson .teach { font-size:.93rem; color:#37474f; margin:.4rem 0 .6rem; }
        .lesson .actions { display:flex; gap:.5rem; flex-wrap:wrap; }
        .btn { display:inline-block; padding:.45rem 1rem; border-radius:50px; text-decoration:none; font-weight:700; font-size:.85rem; border:none; cursor:pointer; }
        .btn.watch { background:#F44336; color:#fff; }
        .btn.sheet { background:var(--primary); color:#fff; }
        .btn.novideo { background:#eee; color:#999; cursor:default; }
        /* player modal */
        .modal-overlay { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.85); align-items:center; justify-content:center; padding:1rem; }
        .modal-overlay.open { display:flex; }
        .modal-box { width:100%; max-width:860px; }
        .modal-head { display:flex; justify-content:space-between; align-items:center; color:#fff; margin-bottom:.6rem; gap:1rem; }
        .modal-close { background:#fff; color:#212121; border:none; border-radius:50px; padding:.5rem 1.1rem; font-weight:700; cursor:pointer; }
        .modal-frame { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
        .modal-frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
        @media (max-width:480px){ header{flex-direction:column;align-items:stretch;} }
    </style>
    <script src="js/grade.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="book-title">Learn by the Book</h1>
            <a class="home" href="index.html">&larr; Home</a>
        </header>
        <div class="intro" id="intro"></div>
        <div id="topics"></div>
    </div>

    <div class="modal-overlay" id="player-modal">
        <div class="modal-box">
            <div class="modal-head"><h3 id="player-title"></h3><button class="modal-close" id="player-close">✕ Close</button></div>
            <div class="modal-frame" id="player-frame"></div>
        </div>
    </div>

    <script>
    (function () {
        const params = new URLSearchParams(location.search);
        const subject = (params.get('subject') || 'math').replace(/[^a-z]/g, '');
        if (window.FastGrade && FastGrade.get() !== '6') FastGrade.set('6');

        fetch('data/books/' + subject + '.json')
            .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
            .then(function (data) { render(data); })
            .catch(function () {
                document.getElementById('topics').innerHTML = '<div class="intro">This book is coming soon. 📚</div>';
            });

        function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

        function render(data) {
            document.title = 'FAST Test Prep — ' + data.title;
            document.getElementById('book-title').textContent = data.title;
            document.getElementById('intro').textContent = data.intro || '';
            const topicsHtml = (data.topics || []).map(function (t) {
                let practice = '';
                if (subject === 'math' && t.practiceTopic) {
                    practice = '<a class="topic-practice" href="ai-practice.html?section=math&topic=' + t.practiceTopic + '">✏️ Practice this topic</a><br>';
                } else if (data.practiceSection) {
                    practice = '<a class="topic-practice" href="quiz.html?section=' + data.practiceSection + '">✏️ Practice this topic</a><br>';
                }
                const lessons = (t.lessons || []).map(function (L) {
                    const watch = L.videoId
                        ? '<button class="btn watch" data-vid="' + esc(L.videoId) + '" data-vtitle="' + esc(L.videoTitle || L.title) + '">📺 Watch</button>'
                        : '<span class="btn novideo">No video</span>';
                    const sheet = '<a class="btn sheet" href="worksheet.html?subject=' + subject + '&lesson=' + encodeURIComponent(L.code) + '">🖨️ Worksheet</a>';
                    return '<div class="lesson"><div class="lh"><span class="code">' + esc(L.code) + '</span><span class="lt">' + esc(L.title) + '</span></div>' +
                        '<div class="teach">' + esc(L.teach) + '</div>' +
                        '<div class="actions">' + watch + sheet + '</div></div>';
                }).join('');
                return '<div class="topic"><div class="topic-head"><div class="topic-num">' + t.n + '</div><h2>Topic ' + t.n + ' — ' + esc(t.title) + '</h2><span class="chev">▶</span></div>' +
                    '<div class="topic-body">' + practice + lessons + '</div></div>';
            }).join('');
            document.getElementById('topics').innerHTML = topicsHtml;
            const first = document.querySelector('.topic'); if (first) first.classList.add('open');

            // accordion
            document.getElementById('topics').addEventListener('click', function (e) {
                const head = e.target.closest('.topic-head');
                if (head) { head.parentElement.classList.toggle('open'); return; }
                const w = e.target.closest('.btn.watch');
                if (w) openPlayer(w.getAttribute('data-vid'), w.getAttribute('data-vtitle'));
            });
        }

        // player
        const modal = document.getElementById('player-modal');
        const frame = document.getElementById('player-frame');
        function openPlayer(id, title) {
            document.getElementById('player-title').textContent = title || '';
            frame.innerHTML = '<iframe src="https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
            modal.classList.add('open');
        }
        function closePlayer() { modal.classList.remove('open'); frame.innerHTML = ''; }
        document.getElementById('player-close').addEventListener('click', closePlayer);
        modal.addEventListener('click', function (e) { if (e.target === modal) closePlayer(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePlayer(); });
    })();
    </script>
</body>
</html>
